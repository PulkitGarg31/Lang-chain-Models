<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      width: 400px;
      height: 560px;
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    #header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1f1f1f;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f0f0f;
    }

    #yt-icon {
      width: 28px; height: 28px;
      background: #ff0000;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    #yt-icon svg { width: 16px; height: 16px; fill: white; }

    #header-text { flex: 1; min-width: 0; }
    #header-title { font-size: 13px; font-weight: 600; color: #fff; }
    #video-url {
      font-size: 10px; color: #555;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 1px;
    }

    #status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
      box-shadow: 0 0 6px #22c55e88;
    }
    #status-dot.off { background: #ef4444; box-shadow: 0 0 6px #ef444488; }

    /* Chat area */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a transparent;
    }

    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-track { background: transparent; }
    #chat-box::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

    /* Empty state */
    #empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; color: #3a3a3a; text-align: center;
      padding: 24px;
    }
    #empty-state svg { width: 32px; height: 32px; opacity: 0.3; }
    #empty-state p { font-size: 13px; line-height: 1.5; }

    /* Messages */
    .msg-row { display: flex; gap: 8px; align-items: flex-start; }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; flex-shrink: 0; margin-top: 2px;
    }
    .avatar.user-av { background: #ff0000; color: white; }
    .avatar.bot-av  { background: #1a1a1a; color: #888; border: 1px solid #2a2a2a; }

    .bubble {
      max-width: 290px;
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
    }

    .user .bubble {
      background: #ff0000;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background: #181818;
      color: #d4d4d4;
      border: 1px solid #242424;
      border-bottom-left-radius: 4px;
    }

    /* Markdown-style formatting inside bot bubble */
    .bubble strong { color: #fff; font-weight: 600; }
    .bubble em { color: #aaa; font-style: italic; }

    .bubble ul, .bubble ol {
      padding-left: 16px;
      margin: 6px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bubble li { color: #c8c8c8; }
    .bubble li::marker { color: #ff4444; }

    .bubble p + p { margin-top: 6px; }

    /* Typing indicator */
    .typing-dots { display: flex; gap: 4px; padding: 4px 2px; }
    .typing-dots span {
      width: 6px; height: 6px;
      background: #444; border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); background: #444; }
      30% { transform: translateY(-5px); background: #ff4444; }
    }

    /* Input area */
    #input-area {
      padding: 12px 14px;
      border-top: 1px solid #1a1a1a;
      background: #0f0f0f;
    }

    #input-row {
      display: flex; gap: 8px; align-items: center;
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 6px 8px 6px 14px;
      transition: border-color 0.2s;
    }
    #input-row:focus-within { border-color: #ff0000; }

    #query {
      flex: 1; background: transparent; border: none; outline: none;
      color: #e8e8e8; font-family: 'DM Sans', sans-serif;
      font-size: 13px; resize: none; line-height: 1.4;
      max-height: 80px; overflow-y: auto;
    }
    #query::placeholder { color: #3a3a3a; }

    #send {
      width: 30px; height: 30px; border-radius: 8px;
      background: #ff0000; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s, transform 0.1s;
    }
    #send:hover { background: #e60000; }
    #send:active { transform: scale(0.93); }
    #send:disabled { background: #2a2a2a; cursor: not-allowed; }
    #send svg { width: 14px; height: 14px; fill: white; }

    #error-msg { font-size: 11px; color: #ef4444; margin-top: 6px; padding-left: 4px; }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div id="yt-icon">
    <svg viewBox="0 0 24 24"><path d="M23.5 6.2s-.3-2-1.2-2.8c-1.1-1.2-2.4-1.2-3-1.3C16.8 2 12 2 12 2s-4.8 0-7.3.1c-.6.1-1.9.1-3 1.3C.8 4.2.5 6.2.5 6.2S.2 8.5.2 10.8v2.1c0 2.3.3 4.6.3 4.6s.3 2 1.2 2.8c1.1 1.2 2.6 1.1 3.3 1.2C7.2 21.7 12 21.8 12 21.8s4.8 0 7.3-.2c.6-.1 1.9-.1 3-1.3.9-.8 1.2-2.8 1.2-2.8s.3-2.3.3-4.6v-2.1c0-2.3-.3-4.6-.3-4.6zM9.7 15.5V8.4l8.1 3.6-8.1 3.5z"/></svg>
  </div>
  <div id="header-text">
    <div id="header-title">YouTube Chat</div>
    <div id="video-url">Detecting video...</div>
  </div>
  <div id="status-dot" class="off"></div>
</div>

<!-- Chat -->
<div id="chat-box">
  <div id="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
    <p>Ask anything about<br/>the video you're watching</p>
  </div>
</div>

<!-- Input -->
<div id="input-area">
  <div id="input-row">
    <textarea id="query" rows="1" placeholder="Ask about this video..."></textarea>
    <button id="send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div id="error-msg"></div>
</div>

<script src="popup.js" defer></script>

</body>
</html>
